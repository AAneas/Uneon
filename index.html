<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capture Styler</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--fg:#1b1f2a;--card:#fff;--mut:#667085;--bd:#d0d5dd}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--fg:#e8eaf0;--card:#1c2130;--mut:#9aa3b5;--bd:#343b50}}
:root[data-theme="dark"]{--bg:#12151c;--fg:#e8eaf0;--card:#1c2130;--mut:#9aa3b5;--bd:#343b50}
[hidden]{display:none!important}
body{margin:0;padding:10px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;max-width:460px;margin:20px auto}
h1{font-size:1.3rem;margin:0 0 6px}
input{padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;max-width:100%}
button{padding:8px 12px;margin:3px 3px 3px 0;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
button[aria-pressed="true"]{outline:2px solid #3b82f6}
#cols button{width:32px;height:32px;padding:0;border-radius:50%;border:2px solid var(--bd)}
#app{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start;max-width:1700px;margin:0 auto}
#app.mj{grid-template-columns:minmax(230px,290px) minmax(0,1fr) minmax(210px,260px)}
#app.pl{max-width:1000px}
#app.pl #left{display:contents}
#app.pl #bars{order:1}#app.pl .wrap{order:2}#app.pl #info{order:3}
@media(max-width:1000px){#app.mj{grid-template-columns:minmax(0,1fr)}}
aside{display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;gap:6px;align-items:center}
.row input{flex:1;min-width:0}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;width:0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.mjp label{display:block;margin:5px 0}
select{padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;max-width:100%}
.wrap{position:relative;max-width:1000px;width:100%}
canvas{width:100%;height:auto;display:block;border-radius:12px;touch-action:none}
#ban{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;line-height:1.1;text-align:center;font-size:2.4rem;font-weight:800;color:#fff;background:#0008;border-radius:12px;pointer-events:none}
#ban span{text-shadow:0 0 6px #000,0 0 2px #000}
#bgs{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 6px}
#bgs button{width:28px;height:28px;padding:0;margin:0;border-radius:50%;border:2px solid var(--bd)}
small{color:var(--mut)}
</style></head><body>
<div id="join" class="card">
<h1>🌀 Capture Styler</h1>
<p>Par défaut, tout le monde se retrouve dans la partie générale. Pour jouer en privé, le meneur crée un lobby privé et partage son code (ou son lien).</p>
<input id="nick" placeholder="✏️ Ton prénom" maxlength="16"> <input id="code" placeholder="🔑 Code (vide = partie générale)" maxlength="8" style="width:200px;text-transform:uppercase">
<p id="cols"></p>
<label>🎨 Autre couleur <input id="cc" type="color" value="#ef4444"></label>
<p><button id="jp">🎮 Rejoindre comme joueur</button></p>
<p><button id="gm">👑 Meneur : partie générale</button><button id="gp">🔒 Meneur : lobby privé</button></p>
<p id="err" style="color:#ef4444"></p>
</div>
<div id="app" hidden>
<aside id="left">
<div id="bars">
<b id="name"></b>
<div><div class="bar"><i id="prog" style="background:#22c55e"></i></div><small id="pt"></small></div>
<div id="enb"><div class="bar"><i id="en" style="background:#f59e0b"></i></div><small id="et"></small></div>
</div>
<div id="info">
<div><small id="net"></small> <button id="snd" title="Sons">🔊</button></div>
<div id="lkr" class="row" hidden><input id="lk" readonly><button id="cp">📋 Copier le lien</button></div>
<div id="who"></div>
<small id="help"></small>
</div>
<div id="mjl" class="mjp" hidden>
<label>🎯 Boucles à réussir <input id="nd" type="number" min="1" value="5" style="width:60px"></label>
<label>⚡ Énergie par joueur <input id="ne" type="number" min="1" value="10" style="width:60px"></label>
<label>🖼️ Image(s) de la cible (PNG) <input id="im" type="file" accept="image/png" multiple></label><button id="ri">🗑️ Retirer l’image</button>
<label>📏 Taille de la cible <input id="sz" type="range" min="40" max="640" value="130"></label>
<div>↔️ L’image regarde vers <button id="fc" aria-pressed="false">➡️</button></div>
<small>🏞️ Fond</small><div id="bgs"></div>
</div>
</aside>
<div class="wrap"><canvas id="cv"></canvas><div id="ban" hidden></div></div>
<aside id="right" class="mjp" hidden>
<div><button id="tc" aria-pressed="true">🕹️ Déplacer la cible</button><button id="tz" aria-pressed="false">⭕ Attaque ronde</button><button id="tk" aria-pressed="false">🔺 Attaque en cône</button><button id="to" aria-pressed="false">🪨 Obstacles</button><button id="co">🧹 Effacer les obstacles</button></div>
<label>📐 Ouverture du cône <input id="ca" type="range" min="10" max="90" value="30"></label>
<label>🚶 Déplacement <select id="mv"><option value="">Manuel</option><option value="patrouille">Patrouille</option><option value="fuite">Fuite</option><option value="charges">Charges</option><option value="zigzags">Zigzags</option><option value="cercles">Cercles</option><option value="sauts">Sauts</option><option value="roulades">Roulades</option><option value="tunnel">Tunnel</option><option value="aleatoire">Aléatoire</option></select></label>
<div><button id="au" aria-pressed="false">🤖 Attaques auto : OFF</button><button id="bo" aria-pressed="false">👹 Boss : OFF</button></div>
<label>⏱️ Fréquence des attaques <input id="fq" type="range" min="1" max="10" value="4"></label>
<div><button id="ra">🎲 Attaques aléatoires [Espace]</button><button id="hl">💚 Soigner joueurs</button><button id="nw">🔄 Nouvelle capture</button><button id="mm" aria-pressed="false">👥 Mode multi : OFF</button><button id="mt" aria-pressed="false">🧪 Mode test : OFF</button></div>
</aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const COLS=["#ef4444","#ec4899","#8b5cf6","#3b82f6","#06b6d4","#22c55e","#eab308","#f97316","#f5f5f5","#111111"];
const W=1000,H=625,DUR=800,MAXP=168,cv=$("cv"),g=cv.getContext("2d");cv.width=W;cv.height=H;
let peer=null,host=null,conns=[],code="",lobby="",myId="me",imgData=null,imgData2=null,imgTy=[],tyL=[],tImg=null,tMask=null,tImg2=null,tMask2=null,domC=null,tp=null,ph=0,am=0,fl=1,sx=1,jn=[],jf=0,ls=0,myc=COLS[0],me={},role=null,pts=[],drawing=false,tool="cible",dtool="cible",opv=null,zc=[0,0],mp=[500,312],mvMode="",mst={},msub="",muntil=0,mrot=0,mvis=1,mholes=[],mls=0,mlt=0,autoOn=false,boss=false,nextAuto=0,wasBoss=false,angerT=-9e9,sndOn=true,actx=null;
const sndT={};
const ghosts=[],last={},fx={},state={},atks=[];
const ap=(o,p)=>{for(const k in p){if(p[k]===null)delete o[k];else o[k]=p[k]}};
const all=()=>Object.entries(state).map(([id,presence])=>({peer:id,isMe:id===myId,presence}));
const bc=(m,x)=>conns.forEach(c=>{if(c!==x&&c.open)c.send(m)});
const S=()=>Object.assign({tgt:[500,312],need:5,maxE:10,name:"Pokémon sauvage"},(all().find(p=>p.presence.role==="mj")||{}).presence||{});
const loops=()=>all().reduce((a,p)=>a+(p.presence.role==="p"?p.presence.loops||0:0),0);
const hex=c=>/^#[0-9a-fA-F]{6}$/.test(c),okc=c=>hex(c)?c:"#aaaaaa";
function setP(p){ap(me,p);const k=Object.keys(p);if(k.length===1&&(k[0]==="pts"||k[0]==="pv")&&p[k[0]]!==null){const n=performance.now();if(n-ls<40)return;ls=n}
 if(role==="mj")bc({t:"u",id:myId,patch:p});else if(host&&host.open)host.send({t:"p",patch:p})}
function loadI(d,cb){if(typeof d!=="string"||!d.startsWith("data:image/png;base64,")||d.length>1300000)return cb(null,null,null);const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=i.naturalWidth;c.height=i.naturalHeight;const x=c.getContext("2d");x.drawImage(i,0,0);let m=null,dc=null;try{m=x.getImageData(0,0,c.width,c.height);dc=dom(m.data)}catch(e){}cb(i,m,dc)};i.onerror=()=>cb(null,null,null);i.src=d}
function setImgs(d,d2){tImg=tMask=tImg2=tMask2=null;domC=null;loadI(d,(i,m,dc)=>{tImg=i;tMask=m;domC=dc});loadI(d2,(i,m)=>{tImg2=i;tMask2=m})}
const curI=()=>atks.length&&tImg2?[tImg2,tMask2]:[tImg,tMask];
function dom(d){const c={},a={};let n=0,m=0;
 for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;n++;const r=d[i],g_=d[i+1],b=d[i+2],mx=Math.max(r,g_,b),mn=Math.min(r,g_,b);let k,M;
  if(mx-mn>=40&&mx>=64){const dd=mx-mn,h=mx===r?((g_-b)/dd+6)%6:mx===g_?(b-r)/dd+2:(r-g_)/dd+4;k="c"+(h*2|0);M=c;m++}else{k="g"+((r>>6)<<4|(g_>>6)<<2|(b>>6));M=a}
  const o=M[k]||(M[k]=[0,0,0,0]);o[0]+=r;o[1]+=g_;o[2]+=b;o[3]++}
 const U=m>=n*.04?c:a;let best=null;for(const k in U)if(!best||U[k][3]>best[3])best=U[k];return best&&[best[0]/best[3],best[1]/best[3],best[2]/best[3]]}
function mkps(a){const r=+a.r||0,A=a.k==="c"?3.14159*r*r:(+a.f||30)/57.3*r*r;return Array.from({length:Math.min(50,6+Math.round(A/1800))},()=>({u:Math.random(),v:Math.random(),s:Math.random()}))}
function addAtk(l){if(!Array.isArray(l))return;l.forEach(a=>{if(a&&(a.k==="c"||a.k==="k")&&atks.length<40){atks.push({k:a.k,x:+a.x||0,y:+a.y||0,r:+a.r||0,d:+a.d||0,f:+a.f||30,du:+a.du||DUR,t0:performance.now()+(+a.dl||0),ps:mkps(a)});snd("atk",+a.dl||0)}})}
function reset(en){atks.length=0;for(const id in state)if(state[id].role==="p"){state[id].loops=0;state[id].en=en}}
function scaleE(o,n){for(const id in state)if(state[id].role==="p"){const e=state[id].en??o;state[id].en=Math.min(n,e>0?Math.max(1,Math.round(e*n/o)):0)}}
function heal(e){for(const id in state)if(state[id].role==="p")state[id].en=e}
function launch(l){const du=boss?DUR/1.6:DUR;l.forEach(a=>a.du=du);addAtk(l);bc({t:"atk",a:l})}
function newRound(){const e=me.maxE||10;setP({round:(me.round||0)+1,lw:null});reset(e);bc({t:"rs",en:e})}
function randAtk(){launch(Array.from({length:3+Math.random()*3|0},()=>({k:"c",x:80+Math.random()*(W-160),y:80+Math.random()*(H-160),r:45+Math.random()*50,dl:Math.random()*600})))}
function snd(k,dl=0){if(!sndOn||!actx)return;const n=performance.now()+dl;if(n-(sndT[k]||-9e9)<130)return;sndT[k]=n;
 setTimeout(()=>{try{if(actx.state==="suspended")actx.resume();const t=actx.currentTime,o=actx.createOscillator(),v=actx.createGain();o.connect(v);v.connect(actx.destination);
  if(k==="loop"){o.type="sine";o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.09);v.gain.setValueAtTime(.07,t);v.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.26)}
  else if(k==="cut"){o.type="sawtooth";o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(90,t+.2);v.gain.setValueAtTime(.05,t);v.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.23)}
  else{o.type="triangle";o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(420,t+.25);v.gain.setValueAtTime(.001,t);v.gain.exponentialRampToValueAtTime(.06,t+.08);v.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.31)}
 }catch(e){}},dl)}
const FADE=["spectre","dragon","fee","insecte","vol"];
const mgn=()=>Math.min(170,(S().isz||130)/2+20);
const rpt=()=>{const m=mgn();return[m+Math.random()*(W-2*m),m+Math.random()*(H-2*m)]};
const gt=(w,sp_,dt)=>{const dx=w[0]-mp[0],dy=w[1]-mp[1],d=Math.hypot(dx,dy);if(d<5)return true;const k=Math.min(d,sp_*dt)/d;mp[0]+=dx*k;mp[1]+=dy*k;return false};
function heads(){return all().filter(p=>p.presence.role==="p"&&p.presence.pts&&p.presence.pts.length>=2).map(p=>{const q=p.presence.pts;return[q[q.length-2],q[q.length-1]]})}
function beh(n,st,dt,now){
 if(n==="patrouille"){if(!st.w)st.w=rpt();if(gt(st.w,130,dt)){st.p=st.p||now+400+Math.random()*700;if(now>st.p){st.w=rpt();st.p=0}}}
 else if(n==="fuite"){let ax=0,ay=0;for(const h of heads()){const dx=mp[0]-h[0],dy=mp[1]-h[1],d=Math.hypot(dx,dy)+1;if(d<380){ax+=dx/d*(380-d);ay+=dy/d*(380-d)}}
  const f=Math.hypot(ax,ay);if(f>1){mp[0]+=ax/f*230*dt;mp[1]+=ay/f*230*dt}else if(!st.w||gt(st.w,70,dt))st.w=rpt()}
 else if(n==="charges"){if(!st.ph){st.ph="wait";st.t=now+900}
  if(st.ph==="wait"){if(now>st.t){const hs=heads();st.w=hs.length?hs[Math.random()*hs.length|0].slice():rpt();st.ph="go";st.t=now+700}}
  else if(st.ph==="go"){if(gt(st.w,520,dt)||now>st.t){st.ph="rest";st.t=now+1000}}
  else if(now>st.t){st.ph="wait";st.t=now+400}}
 else if(n==="zigzags"){if(!st.w){st.w=rpt();st.o=0}const dx=st.w[0]-mp[0],dy=st.w[1]-mp[1],d=Math.hypot(dx,dy);
  if(d<10)st.w=rpt();else{st.o+=dt*5;const q=Math.sin(st.o)*dt*260;mp[0]+=dx/d*170*dt-dy/d*q;mp[1]+=dy/d*170*dt+dx/d*q}}
 else if(n==="cercles"){if(!st.c||now>st.u){const R=110+Math.random()*80,m=R+30;st.r=R;st.c=[m+Math.random()*(W-2*m),m+Math.random()*(H-2*m)];st.u=now+8000;st.a=st.a||0}
  st.a+=dt*1.5;gt([st.c[0]+Math.cos(st.a)*st.r,st.c[1]+Math.sin(st.a)*st.r],330,dt)}
 else if(n==="sauts"){if(!st.ph){st.ph="rest";st.t=now+600}
  if(st.ph==="rest"){if(now>st.t){const a=Math.random()*6.283,d=140+Math.random()*100;st.w=[mp[0]+Math.cos(a)*d,mp[1]+Math.sin(a)*d];st.ph="jump";st.t=now+420}}
  else if(gt(st.w,520,dt)||now>st.t){st.ph="rest";st.t=now+700}}
 else if(n==="roulades"){mrot+=dt*9;if(!st.w)st.w=rpt();if(gt(st.w,260,dt))st.w=rpt()}
 else if(n==="tunnel"){const fd=tyL.some(x=>FADE.includes(x)),D=fd?900:450;
  if(!st.ph){st.ph="patrol";st.t=now+3500+Math.random()*3000}
  if(st.ph==="patrol"){if(!st.w||gt(st.w,120,dt))st.w=rpt();if(now>st.t){st.ph="sink";st.t=now+D;if(!fd)mholes=[[mp[0],mp[1]]]}}
  else if(st.ph==="sink"){mvis=Math.max(0,(st.t-now)/D);if(now>=st.t){mvis=0;mholes=[];st.ph="under";st.d=rpt();st.t=now+1500+Math.random()*1500;st.a=false}}
  else if(st.ph==="under"){if(!fd&&!st.a&&now>st.t-1200){mholes=[st.d];st.a=true}if(now>=st.t){mp[0]=st.d[0];mp[1]=st.d[1];st.ph="rise";st.t=now+D}}
  else if(st.ph==="rise"){mvis=Math.min(1,1-(st.t-now)/D);if(now>=st.t){mvis=1;mholes=[];st.ph="patrol";st.t=now+4000+Math.random()*3500;st.w=null}}}}
function moveStep(dt,now){let n=mvMode;
 if(n==="aleatoire"){if(!msub||now>muntil){msub=["patrouille","fuite","charges","zigzags","cercles","sauts","roulades","tunnel"][Math.random()*8|0];muntil=now+5000;mst={}}n=msub}
 beh(n,mst,dt,now);
 if(n!=="roulades"){mrot%=6.2832;if(mrot>3.1416)mrot-=6.2832;mrot*=.85}
 if(n!=="tunnel"){mvis=Math.min(1,mvis+dt*3);if(mholes.length)mholes=[]}
 const m=mgn();mp[0]=Math.max(m,Math.min(W-m,mp[0]));mp[1]=Math.max(m,Math.min(H-m,mp[1]));
 const rr=(S().isz||130)*.26;for(const o of me.obs||[]){const dx=mp[0]-o[0],dy=mp[1]-o[1],d=Math.hypot(dx,dy),mn=o[2]+rr;if(d<mn&&d>.01){mp[0]=o[0]+dx/d*mn;mp[1]=o[1]+dy/d*mn}}}
function sendMv(){setP({tgt:[Math.round(mp[0]),Math.round(mp[1])],rot:+mrot.toFixed(2),vis:+mvis.toFixed(2),holes:mholes.map(h=>[Math.round(h[0]),Math.round(h[1])])})}
function autoFire(){const r=Math.random(),hs=heads(),T=S().tgt;if(r<.05)return randAtk();
 for(let i=0;i<(boss?2:1);i++){
  if(r<.30){const h=hs.length&&Math.random()<.6?hs[Math.random()*hs.length|0]:[80+Math.random()*(W-160),80+Math.random()*(H-160)];launch([{k:"c",x:h[0],y:h[1],r:60+Math.random()*50}])}
  else{const h=hs.length&&Math.random()<.7?hs[Math.random()*hs.length|0]:null,an=h?Math.atan2(h[1]-T[1],h[0]-T[0])*180/Math.PI:Math.random()*360-180;launch([{k:"k",x:T[0],y:T[1],r:260+Math.random()*160,d:an+(i?(Math.random()-.5)*60:0),f:22+Math.random()*18}])}}}
function mjTick(){if(role!=="mj")return;const now=performance.now(),dt=Math.min(.1,(now-(mlt||now))/1000);mlt=now;
 if(mvMode){moveStep(dt,now);if(now-mls>=33){mls=now;sendMv()}}
 if(autoOn&&now>nextAuto){autoFire();nextAuto=now+(11000/(+$("fq").value||4))*(.6+Math.random()*.8)/(boss?2:1)}}
const fail=m=>{$("err").textContent=m};
const clean=p=>{const q={};for(const k of ["role","nick","c","loops","pts","fxK","fxN","en"])if(k in p)q[k]=p[k];if(q.role)q.role="p";if("c" in q&&!hex(q.c))q.c="#aaaaaa";if(typeof q.nick==="string")q.nick=q.nick.slice(0,16);return q};
function hostConn(c){conns.push(c);
 c.on("open",()=>c.send({t:"s",state,img:imgData,img2:imgData2,ty:imgTy}));
 c.on("data",m=>{if(m&&m.t==="p"&&m.patch){const q=clean(m.patch),pr=state[c.peer]||(state[c.peer]={}),old=pr.loops||0;ap(pr,q);bc({t:"u",id:c.peer,patch:q},c);if(q.loops>old)setP({lw:[String(pr.nick||"?").slice(0,16),okc(pr.c)]})}else if(m&&m.t==="cl"&&typeof m.q==="string"){const d=conns.find(x=>x.peer===m.q);if(d&&d.open)d.send({t:"clr",k:m.k==="ok"?"ok":"miss"})}else if(m&&m.t==="cx"&&typeof m.q==="string"){const d=conns.find(x=>x.peer===m.q);if(d&&d.open)d.send({t:"cxr"})}});
 c.on("close",()=>{conns=conns.filter(x=>x!==c);delete state[c.peer];bc({t:"x",id:c.peer})})}
const ID="styler-uneon-";
function startHost(priv){const typed=$("code").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
 code=priv?(typed||Array.from({length:5},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.random()*32|0]).join("")):"";
 if(typeof Peer==="undefined")return fail("PeerJS n’a pas pu se charger (connexion internet ?).");
