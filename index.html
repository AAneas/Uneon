<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capture Styler</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--fg:#1b1f2a;--card:#fff;--mut:#667085;--bd:#d0d5dd}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--fg:#e8eaf0;--card:#1c2130;--mut:#9aa3b5;--bd:#343b50}}
:root[data-theme="dark"]{--bg:#12151c;--fg:#e8eaf0;--card:#1c2130;--mut:#9aa3b5;--bd:#343b50}
[hidden]{display:none!important}
body{margin:0;padding:10px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;max-width:460px;margin:20px auto}
h1{font-size:1.3rem;margin:0 0 6px}
input{padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;max-width:100%}
button{padding:8px 12px;margin:3px 3px 3px 0;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
button[aria-pressed="true"]{outline:2px solid #3b82f6}
#cols button{width:32px;height:32px;padding:0;border-radius:50%;border:2px solid var(--bd)}
#app{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start;margin:0 auto}
#app.mj{grid-template-columns:minmax(250px,320px) minmax(0,1fr) minmax(250px,320px)}
#app.mj aside{max-height:calc(100vh - 20px);overflow-y:auto;overflow-x:hidden}
aside{min-width:0}
aside button,aside input,aside select{max-width:100%;box-sizing:border-box}
aside input[type=file],#ok,#mv{width:100%}
.mjp>div{display:flex;flex-wrap:wrap;gap:4px}
.mjp>.col{flex-direction:column;flex-wrap:nowrap;align-items:flex-start}
.mjp label{overflow-wrap:anywhere}
#app.pl #left{display:contents}
#app.pl #bars{order:1}#app.pl #mid{order:2}#app.pl #info{order:3}
@media(max-width:1000px){#app.mj{grid-template-columns:minmax(0,1fr)}#app.mj aside{max-height:none;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:8px 14px;overflow:visible}#app.mj aside>*{flex:0 1 auto}#app.mj .mjp{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px 14px;align-items:flex-start}#app.mj .mjp>*{margin:0;flex:0 1 auto}#app.mj .mjp>.col{flex-direction:row;flex-wrap:wrap}#app.mj #bars,#app.mj #info{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}#app.mj #bars>div{flex:1 1 140px}}
#mid{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
#mid small{align-self:stretch}
#who{max-height:110px;overflow:auto}
#toast{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:10px;font-weight:600;pointer-events:none;max-width:90%;text-align:center}
aside{display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;gap:6px;align-items:center}
.row input{flex:1;min-width:0}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;width:0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.mjp label{display:block;margin:5px 0}
select{padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;max-width:100%}
.wrap{position:relative;width:100%;margin:0 auto}
canvas{width:100%;height:auto;display:block;border-radius:12px;touch-action:none}

small{color:var(--mut)}
</style></head><body>
<div id="join" class="card">
<h1>🌀 Capture Styler</h1>
<p>Par défaut, tout le monde se retrouve dans la partie générale. Pour jouer en privé, le meneur crée un lobby privé et partage son code (ou son lien).</p>
<input id="nick" placeholder="✏️ Ton prénom" maxlength="16"> <input id="code" placeholder="🔑 Code (vide = partie générale)" maxlength="8" style="width:200px;text-transform:uppercase">
<p id="cols"></p>
<label>🎨 Autre couleur <input id="cc" type="color" value="#ef4444"></label>
<p><button id="jp">🎮 Rejoindre comme joueur</button></p>
<p><button id="gm">👑 Meneur : partie générale</button><button id="gp">🔒 Meneur : lobby privé</button></p>
<p id="rs" hidden><button id="rb">↩️ Reprendre ma partie</button></p><p id="err" style="color:#ef4444"></p>
</div>
<div id="app" hidden>
<aside id="left">
<div id="bars">
<b id="name"></b>
<div><div class="bar"><i id="prog" style="background:#22c55e"></i></div><small id="pt"></small></div>
<div id="enb"><div class="bar"><i id="en" style="background:#f59e0b"></i></div><small id="et"></small></div>
</div>
<div id="info">
<div><small id="net"></small> <button id="snd" title="Sons">🔊</button></div>
<div id="lkr" class="row" hidden><input id="lk" readonly><button id="cp">📋 Copier le lien</button></div>
<div id="who"></div>
</div>
<div id="mjl" class="mjp" hidden>
<label>🎯 Boucles à réussir <input id="nd" type="number" min="1" value="5" style="width:60px"></label>
<label>⚡ Énergie par joueur <input id="ne" type="number" min="1" value="10" style="width:60px"></label>
<label>🖼️ Image(s) de la cible (PNG) <input id="im" type="file" accept="image/png" multiple></label><button id="ri">🗑️ Retirer l’image</button>
<label>🧼 Retrait du contour <input id="ol" type="range" min="0" max="100" value="0"></label>
<label>📏 Taille de la cible <input id="sz" type="range" min="40" max="640" value="130"></label>
<div>↔️ L’image regarde vers <button id="fc" aria-pressed="false">➡️</button></div>
<small>🏞️ Fond</small><div id="bgs"></div>
<label>🪨 Obstacle <select id="ok"><option value="r">🌿 Buisson</option><option value="f">🚧 Clôture</option><option value="t">🌳 Arbre</option><option value="v">🏞️ Rivière</option><option value="p">💧 Flaque</option></select></label>
<div><button id="to" aria-pressed="false">🪨 Placer des obstacles</button><button id="co">🧹 Effacer les obstacles</button></div>
</div>
</aside>
<div id="mid"><div class="wrap" id="wrap"><canvas id="cv"></canvas><div id="ban" hidden></div><div id="toast" hidden></div></div><small id="help"></small></div>
<aside id="right" class="mjp" hidden>
<div class="col"><button id="tc" aria-pressed="true">🕹️ Déplacer la cible</button><button id="tz" aria-pressed="false">⭕ Attaque ronde</button><button id="tk" aria-pressed="false">🔺 Attaque en cône</button><button id="ra">🎲 Attaques aléatoires [Espace]</button></div>
<label>📐 Ouverture du cône <input id="ca" type="range" min="10" max="90" value="30"></label>
<label>🚶 Déplacement <select id="mv"><option value="">🕹️ Manuel</option><option value="patrouille">🔁 Patrouille</option><option value="fuite">💨 Fuite</option><option value="charges">🐂 Charges</option><option value="zigzags">⚡ Zigzags</option><option value="cercles">🔄 Cercles</option><option value="sauts">🦘 Sauts</option><option value="roulades">🌀 Roulades</option><option value="tunnel">🕳️ Tunnel</option><option value="aleatoire">🎲 Aléatoire</option></select></label>
<div><button id="au" aria-pressed="false">🤖 Attaques auto : OFF</button><button id="bo" aria-pressed="false">👹 Boss : OFF</button></div>
<label>⏱️ Fréquence des attaques <input id="fq" type="range" min="1" max="10" value="4"></label>
<div><button id="hl">❤️ Soigner joueurs</button><button id="mm" aria-pressed="false">👥 Mode multi : OFF</button><button id="mt" aria-pressed="false">🧪 Mode test : OFF</button></div>
<div><button id="nw">🔄 Nouvelle capture</button></div>
</aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);

const W=1000,H=625,DUR=800,MAXP=168,cv=$("cv"),g=cv.getContext("2d");cv.width=W;cv.height=H;
let peer=null,host=null,conns=[],code="",lobby="",myId="me",imgData=null,imgData2=null,imgTy=[],tyL=[],tImg=null,tMask=null,tImg2=null,tMask2=null,domC=null,tp=null,ph=0,am=0,fl=1,sx=1,jn=[],jf=0,ls=0,myc=COLS[0],me={},role=null,pts=[],drawing=false,tool="cible",dtool="cible",opv=null,zc=[0,0],mp=[500,312],mvMode="",mst={},msub="",muntil=0,mrs=0,mfy=false,mnb=false,mvx=0,mvy=0,sliding=false,msl=null,rawP=null,drift=[0,0],slc=null,dv=[0,0],fvx=0,fvy=0,goal=null,gpath=[],gkey="",gts=0,gridObs=null,gridRad=0,gridBlk=null,rzs=[],joined=false,rtry=0,og1=null,og2=null,olv=-1,olT=0,toastT=0,ra=0,lastF=0,mvis=1,mholes=[],mls=0,mlt=0,autoOn=false,boss=false,nextAuto=0,wasBoss=false,angerT=-9e9,sndOn=true,actx=null;
const sndT={};
const ghosts=[],last={},fx={},state={},atks=[];
const ap=(o,p)=>{for(const k in p){if(p[k]===null)delete o[k];else o[k]=p[k]}};

const bc=(m,x)=>conns.forEach(c=>{if(c!==x&&c.open)c.send(m)});
const S=()=>Object.assign({tgt:[500,312],need:5,maxE:10,name:"Pokémon sauvage"},(all().find(p=>p.presence.role==="mj")||{}).presence||{});
const loops=()=>all().reduce((a,p)=>a+(p.presence.role==="p"?p.presence.loops||0:0),0);
const hex=c=>/^#[0-9a-fA-F]{6}$/.test(c),okc=c=>hex(c)?c:"#aaaaaa";
function setP(p){ap(me,p);const k=Object.keys(p);if(k.length===1&&(k[0]==="pts"||k[0]==="pv")&&p[k[0]]!==null){const n=performance.now();if(n-ls<40)return;ls=n}
 if(role==="mj")bc({t:"u",id:myId,patch:p});else if(host&&host.open)host.send({t:"p",patch:p})}
function decode(d,cb){if(typeof d!=="string"||!d.startsWith("data:image/png;base64,")||d.length>1300000)return cb(null);const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=i.naturalWidth;c.height=i.naturalHeight;const x=c.getContext("2d");x.drawImage(i,0,0);try{cb({w:c.width,h:c.height,d:x.getImageData(0,0,c.width,c.height).data})}catch(e){cb(null)}};i.onerror=()=>cb(null);i.src=d}
function outline(d,w,h,sl){let q=sl;for(let k=0;k<6&&q>=8;k++){const r=outline1(d,w,h,q);if(r.ok)return r.out;q*=.8}return[new Uint8Array(w*h),new Uint8Array(w*h)]}
function outline1(d,w,h,sl){const N=w*h,er=new Uint8Array(N),nh=new Uint8Array(N);if(sl<=0)return{ok:true,out:[er,nh]};
 const t=sl/50,theta=6+36*t,D=3+28.5*t,Td=40,Ta=245;
 const L=i=>d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114,vide=i=>d[i*4+3]<10;
 const cnt=new Map();let tot=0;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(d[i*4+3]<Ta)continue;
  if(x==0||vide(i-1)||x==w-1||vide(i+1)||y==0||vide(i-w)||y==h-1||vide(i+w)){tot++;const k=(d[i*4]>>4)<<8|(d[i*4+1]>>4)<<4|(d[i*4+2]>>4),o=cnt.get(k)||[0,0,0,0];o[0]+=d[i*4];o[1]+=d[i*4+1];o[2]+=d[i*4+2];o[3]++;cnt.set(k,o)}}
 const refs=[];cnt.forEach(o=>{if(o[3]>=.06*tot)refs.push([o[0]/o[3],o[1]/o[3],o[2]/o[3]])});
 const seen=new Uint8Array(N),qu=new Int32Array(N),dep=new Int16Array(N);let qh=0,qt=0,opaque=0;
 for(let i=0;i<N;i++){if(d[i*4+3]<10){seen[i]=1;qu[qt++]=i}else if(d[i*4+3]>=Ta)opaque++}
 const dist=(i,j)=>Math.hypot(d[i*4]-d[j*4],d[i*4+1]-d[j*4+1],d[i*4+2]-d[j*4+2]);
 const white=i=>{const r=d[i*4],g_=d[i*4+1],b=d[i*4+2],mx=Math.max(r,g_,b),mn=Math.min(r,g_,b);return L(i)>235&&(mx-mn)<.1*Math.max(mx,1)};
 while(qh<qt){const i=qu[qh++],x=i%w,y=(i-x)/w,pa=d[i*4+3],nd=dep[i]+1;
  for(let k=0;k<4;k++){let j;if(k==0){if(x<1)continue;j=i-1}else if(k==1){if(x>=w-1)continue;j=i+1}else if(k==2){if(y<1)continue;j=i-w}else{if(y>=h-1)continue;j=i+w}
   if(seen[j])continue;const qa=d[j*4+3];let ok;
   if(qa<10)ok=true;else if(qa<Ta)ok=pa<Ta;
   else if(pa>=10&&pa<Ta)ok=false;else if(L(j)<Td)ok=false;
   else if(pa<10){ok=false;for(const r of refs)if(Math.hypot(r[0]-d[j*4],r[1]-d[j*4+1],r[2]-d[j*4+2])<=70){ok=true;break}}
   else ok=dist(i,j)<=theta&&((sl>=50&&white(j))||nd<=D);
   if(ok){seen[j]=1;dep[j]=nd;qu[qt++]=j;if(qa>=Ta)er[j]=1;else if(qa>=10)nh[j]=1}}}
 let ne=0;for(let i=0;i<N;i++)ne+=er[i];
 return{ok:ne<=.4*Math.max(1,opaque),out:[er,nh]}}
function build(o,sl){const{w,h}=o,d=new Uint8ClampedArray(o.d),[er,nh]=outline(d,w,h,sl),mk=new Uint8ClampedArray(w*h*4);

 const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").putImageData(new ImageData(d,w,h),0,0);c.naturalWidth=w;c.naturalHeight=h;
 return{img:c,mask:{width:w,height:h,data:mk},dc:dom(d)}}
function rebuildImgs(){olv=S().ol??0;tImg=tMask=tImg2=tMask2=null;domC=null;
 if(og1){const r=build(og1,olv);tImg=r.img;tMask=r.mask;domC=r.dc}
 if(og2){const r=build(og2,olv);tImg2=r.img;tMask2=r.mask}}
function setImgs(d,d2){og1=og2=null;tImg=tMask=tImg2=tMask2=null;domC=null;decode(d,o=>{og1=o;rebuildImgs()});decode(d2,o=>{og2=o;rebuildImgs()})}
const curI=()=>atks.length&&tImg2?[tImg2,tMask2]:[tImg,tMask];
function dom(d){const c={},a={};let n=0,m=0;
 for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;n++;const r=d[i],g_=d[i+1],b=d[i+2],mx=Math.max(r,g_,b),mn=Math.min(r,g_,b);let k,M;

  const o=M[k]||(M[k]=[0,0,0,0]);o[0]+=r;o[1]+=g_;o[2]+=b;o[3]++}

function mkps(a){const r=+a.r||0,A=a.k==="c"?3.14159*r*r:(+a.f||30)/57.3*r*r;return Array.from({length:Math.min(50,6+Math.round(A/1800))},()=>({u:Math.random(),v:Math.random(),s:Math.random()}))}

function scaleE(o,n){for(const id in state)if(state[id].role==="p"){const e=state[id].en??o;state[id].en=Math.min(n,e>0?Math.max(1,Math.round(e*n/o)):0)}}

function launch(l){const du=rg()?DUR/1.6:DUR;l.forEach(a=>a.du=du);addAtk(l);bc({t:"atk",a:l});l.forEach(addZone)}
function newRound(){const e=me.maxE||10;rzs=[];setP({round:(me.round||0)+1,lw:null,rz:[]});reset(e);bc({t:"rs",en:e})}

  else if(k==="cut"){o.type="sawtooth";o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(90,t+.2);v.gain.setValueAtTime(.05,t);v.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.23)}

  else{o.type="triangle";o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(420,t+.25);v.gain.setValueAtTime(.001,t);v.gain.exponentialRampToValueAtTime(.06,t+.08);v.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.31)}
